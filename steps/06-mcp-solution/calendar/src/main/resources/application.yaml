spring:
  application:
    name: Simple calendar server
  ai:
    mcp:
      server:
        name: calendar-server
        protocol: SSE
        stdio: false
        sse-message-endpoint: /mcp/message
        type: SYNC
  jpa:
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:calendar
    username: sa
    password:
    driverClassName: org.h2.Driver
    hibernate:
      ddl-auto: create-drop
